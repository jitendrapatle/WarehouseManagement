<div class="workspace-shell"
  [class.sidebar-collapsed]="isSidebarCollapsed"
  [class.sidebar-open]="isSidebarOpen">
  <button class="sidebar-backdrop" type="button" aria-label="Close navigation menu" (click)="closeSidebar()"></button>
  <aside class="workspace-sidebar">
    <a class="brand-lockup" href="/admin/client-list" aria-label="Storlane home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M4 13.5 20 5l16 8.5v17L20 39 4 30.5v-17Z" fill="currentColor" opacity=".17" />
          <path d="m7.5 15.3 12.5-6.6 12.5 6.6v13L20 35l-12.5-6.7v-13Z" stroke="currentColor" stroke-width="2" />
          <path d="M12.5 18.2 20 22l7.5-3.8M20 22v8.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="brand-name">stor<span>lane</span></span>
    </a>

    <button class="warehouse-switcher" type="button" aria-label="Current workspace: All warehouses">
      <span class="switcher-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="m3 10 9-6 9 6v10H3V10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M8 20v-7h8v7M7 10h.01M12 10h.01M17 10h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </span>
      <span class="switcher-copy">
        <span class="switcher-label">WORKSPACE</span>
        <strong>All warehouses</strong>
      </span>
      <svg class="switcher-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="m6 8 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <span class="nav-section-label">WORKSPACE</span>
      <a class="nav-item" href="#overview" title="Overview">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <span>Overview</span>
      </a>
      <a class="nav-item" routerLink="/admin/warehouse-list" title="Warehouses">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m3 10 9-6 9 6v10H3V10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M8 20v-7h8v7M7 10h.01M12 10h.01M17 10h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>Warehouses</span>
        <span class="nav-count">4</span>
      </a>
      <a class="nav-item" href="#space" title="Space &amp; units">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6" />
          <path d="M4 10h16M10 4v16" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <span>Space &amp; units</span>
      </a>
      <a class="nav-item" href="#bookings" title="Bookings">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="5.5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6" />
          <path d="M8 3.5v4M16 3.5v4M4 10h16M8 14h3M8 17h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>Bookings</span>
        <span class="nav-count nav-count-new">5</span>
      </a>

      <span class="nav-section-label nav-section-spaced">RELATIONSHIPS</span>
      <a class="nav-item active" href="/admin/client-list" aria-current="page" title="Clients">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M16 20v-1.7a3.3 3.3 0 0 0-3.3-3.3H7.3A3.3 3.3 0 0 0 4 18.3V20M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM16 4.2a3.5 3.5 0 0 1 0 6.6M17 15h.7a3.3 3.3 0 0 1 3.3 3.3V20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Clients</span>
      </a>
      <a class="nav-item" href="#inquiries" title="Inquiries">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.2A7.5 7.5 0 1 1 20 11.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M9.6 9a2.4 2.4 0 1 1 4.1 1.7c-1 .9-1.7 1.1-1.7 2.3M12 16h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>Inquiries</span>
      </a>
      <a class="nav-item" href="#billing" title="Billing">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6" />
          <path d="M3 10h18M7 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>Billing</span>
      </a>

      <span class="nav-section-label nav-section-spaced">INSIGHTS</span>
      <a class="nav-item" href="#reports" title="Reports">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 19V5M4 19h17M8 15v-4M13 15V7M18 15v-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Reports</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="nav-item settings-link" href="#settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6" />
          <path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
        </svg>
        <span>Settings</span>
      </a>
      <button class="nav-item logout-button" type="button" title="Log out" aria-label="Log out" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10M14 16l4-4-4-4M18 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Log out</span>
      </button>
      <div class="sidebar-divider"></div>
      <div class="sidebar-profile">
        <span class="profile-avatar sidebar-avatar">AM</span>
        <span class="profile-copy">
          <strong>{{LoggedInData?.userName}}</strong>
          <small>{{LoggedInData?.role}}</small>
        </span>
        <button class="profile-more" type="button" aria-label="More account options">···</button>
      </div>
    </div>
  </aside>

  <div class="workspace-main">
    <header class="workspace-topbar">
      <button
        class="sidebar-toggle"
        type="button"
        aria-label="Toggle sidebar"
        [attr.aria-expanded]="isSidebarExpanded"
        (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </button>
      <div class="topbar-heading">
        <span class="topbar-subtitle">Manage your customer relationships</span>
      </div>
      <div class="topbar-actions">
        <label class="topbar-search">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.8" cy="8.8" r="5.8" stroke="currentColor" stroke-width="1.5" />
            <path d="m13.2 13.2 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input type="search" placeholder="Search anything..." aria-label="Search anything" />
          <kbd>⌘ K</kbd>
        </label>
        <button class="icon-action help-action" type="button" aria-label="Help and support">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.5" />
            <path d="M8.2 7.6a1.9 1.9 0 1 1 3.3 1.3c-.8.8-1.5 1-1.5 2.1M10 13.8h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
        <button class="icon-action notification-action" type="button" aria-label="Notifications, 3 unread">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M15.5 7.8a5.5 5.5 0 0 0-11 0c0 6.4-2 6.4-2 7.7h15c0-1.3-2-1.3-2-7.7ZM8 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="notification-dot"></span>
        </button>
        <button class="topbar-user" type="button" aria-label="Account: Alex Morgan, workspace admin">
          <span class="profile-avatar topbar-avatar">AM</span>
          <span class="topbar-user-copy"><strong>{{LoggedInData?.userName}} </strong><small>{{LoggedInData?.role}}</small></span>
          <svg class="user-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m6 8 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

  

      </div>
    </header>

    <nav class="breadcrumb-bar" aria-label="Breadcrumb">
      <div class="breadcrumbs">
        <span>Workspace</span>
        <span class="breadcrumb-separator">/</span>
        <strong>Clients</strong>
      </div>
    </nav>

    <main class="workspace-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
